# Scenarios reported on other resolvers (uv, pdm, ultralytics, kedro,
# etc.). Pip currently handles most of these without trouble, so they
# act as regression baselines: a future pip change should not turn any
# of these into ResolutionTooDeep or excessive backtracking.

[boto3-urllib3-transient]
# https://github.com/astral-sh/uv/issues/1398
python_version = "3.9"
platform_system = "Linux"
datetime = "2023-10-01 14:00:00"
requirements = [
    "click >= 7.0",
    "click-loglevel ~= 0.2",
    "dandi >= 0.24.0",
    "psutil ~= 5.9",
    "pyyaml",
    "selenium",
]

